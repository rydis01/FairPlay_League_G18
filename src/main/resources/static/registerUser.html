<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bli medlem</title>
    <link rel="stylesheet" href="login.css">
    <script src="register.js" defer></script>
</head>
<body class="fade fade-out">

<main class="login-box">
    <img src="fairplayleague.png" class="logo" alt="FairPlay League logotyp">

    <h2>Bli medlem</h2>

    <input id="username" type="text" placeholder="Användarnamn" aria-label="Användarnamn">

    <input id="email" type="email" placeholder="Email" aria-label="E-postadress">

    <div class="password-wrapper">
        <input id="password" type="password" placeholder="Lösenord" aria-label="Lösenord">
        <img src="fairplayleague.png" id="togglePassword" class="toggle-icon" alt="Visa eller dölj lösenord">
    </div>

    <button id="registerBtn">Skapa konto</button>

    <p id="result" aria-live="polite"></p>
</main>

</body>
</html>
