<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body class="fade fade-out">

<main class="layout">

    <section class="left-column">
        <h2>Dina kuponger</h2>

        <select id="couponSelect" class="coupon-select" aria-label="Välj kupong">
            <option value="">Välj kupong...</option>
        </select>

        <div id="couponDetails" class="matches-list"></div>
    </section>

    <aside class="right-column">
        <div class="profile-container">
            <h1>Din profil</h1>

            <div class="profile-card">
                <p>
                    <strong>Användarnamn</strong>
                    <span id="username"></span>
                </p>
                <p>
                    <strong>Email</strong>
                    <span id="email"></span>
                </p>
                <p>
                    <strong>Roll</strong>
                    <span id="role"></span>
                </p>
                <p>
                    <strong>Skapad</strong>
                    <span id="createdAt"></span>
                </p>
            </div>

            <button class="logout-btn" onclick="logout()">Logga ut</button>
        </div>
    </aside>

</main>

<nav class="bottom-nav">
    <a href="gameweek.html" class="nav-item">
        <img src="fairplayleague.png" alt="">
        <span>Kupong</span>
    </a>
    <a href="league.html" class="nav-item">
        <img src="fairplayleague.png" alt="">
        <span>Ligor</span>
    </a>
    <a href="profile.html" class="nav-item active">
        <img src="fairplayleague.png" alt="">
        <span>Profil</span>
    </a>
    <a href="information.html" class="nav-item">
        <img src="fairplayleague.png" alt="">
        <span>Om Oss</span>
    </a>
</nav>

<script src="profile.js"></script>
</body>
</html>
