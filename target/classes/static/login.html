<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body class="fade fade-out">

<main class="login-box">
    <img src="fairplayleaguewhite.svg" class="logo" alt="FairPlay League logotyp">

    <h2>Logga in</h2>

    <input id="email" type="email" placeholder="Email" aria-label="E-postadress">

    <div class="password-wrapper">
        <input id="password" type="password" placeholder="Lösenord" aria-label="Lösenord">
        <img src="fairplayleague.png" id="togglePassword" class="toggle-icon" alt="Visa eller dölj lösenord">
    </div>

    <button id="loginBtn">Logga in</button>

    <hr class="divider">

    <button id="registerBtn">Bli medlem</button>

    <p id="result" aria-live="polite"></p>
</main>

</body>
</html>
